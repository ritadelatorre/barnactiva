<body>

      <b><mark> <span id="color">azul</span> </mark></b>.
   </p>
   <p>¿Cual es tu nombre ? <input id="nombre" type="text" />

      <script>
         function cambiarColor() {
            document.getElementById("programa").innerHTML = "JavaScript";

         }
