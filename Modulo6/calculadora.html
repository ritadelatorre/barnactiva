<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CALCULADORA</title>
</head>
<body>
  <p>Primer número: <input type="number" id="num1"></p>  
  <p>Segundo número: <input type="number" id="num2"></p>  
  <p>
    <button onclick="calcular(1)">Suma</button>
    <button onclick="calcular(2)">Resta</button>
    <button onclick="calcular(3)">Multiplicación</button>
    <button onclick="calcular(4)">División</button>
    <button onclick="calcular(5)">Módulo</button>
  </p>

  <script>
    function sumar(valor1, valor2) {
      return valor1+valor2;
    }

    function calcular(operacion) {
      let numero1 = parseFloat(document.getElementById("num1").value);
      let numero2 = parseFloat(document.getElementById("num2").value);
      let resultado = 0;
      switch (operacion) {
        case 1: resultado = sumar(numero1, numero2); break;
        case 2: resultado = restar(numero1, numero2); break;
        case 3: resultado = multiplicar(numero1, numero2); break;
        case 4: resultado = dividir(numero1, numero2); break;
        case 5: resultado = residuo(numero1, numero2); break;
      }
      alert ("El resultado es " + resultado);
    }
  </script>

</body>
</html>
