   <h1>Las salidas del ejercicio son por consola</h1>
   <script>
      let alumnes = ['Pep', 'Paco', 'Aina', 'Lluisa', 'Joan'];
      let i;
      let final = alumnes.length;
      
      for (i=0 ; i<final; i++) {
         console.log("Alumno " + i + " se llama " + alumnes[i]);
      }

      // Numeros del 30 al 3 de 3 en 3
      for (i=30; i>=3; i-=3) {
         console.log("Numero es " + i);
      }

   </script>
